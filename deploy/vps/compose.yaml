name: bi-production

services:
  app:
    image: ${BI_IMAGE:?BI_IMAGE must be set to an immutable image digest}
    container_name: bi-app
    env_file:
      - /etc/bi/production.env
    environment:
      VERCEL_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 3.0
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - hrp-edge

networks:
  hrp-edge:
    name: hrp-edge
    external: true
