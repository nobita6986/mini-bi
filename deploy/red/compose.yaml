name: bi-test

services:
  app:
    image: ${BI_IMAGE:?BI_IMAGE must be an immutable image digest}
    container_name: bi-test-app
    env_file:
      - /etc/bi-test/production.env
    environment:
      VERCEL_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 384
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - supabase

networks:
  supabase:
    name: supabase_default
    external: true
