name: Apply BI production migrations

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA on main
        required: true
        type: string
      backup_confirmation:
        description: Type BACKUP_CONFIRMED after verifying a current Supabase recovery point
        required: true
        type: string
      confirmation:
        description: Type MIGRATE_PRODUCTION
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: bi-production-release
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate SHA and confirmations
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::full 40-character SHA required'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo '::error::SHA is not on main'; exit 1; }
          successful_ci=$(gh run list --workflow CI --commit "$RELEASE_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [[ "$successful_ci" -gt 0 ]] || { echo '::error::SHA has no successful CI run'; exit 1; }
          [[ "$BACKUP_CONFIRMATION" == BACKUP_CONFIRMED ]] || { echo '::error::recovery point confirmation mismatch'; exit 1; }
          [[ "$CONFIRMATION" == MIGRATE_PRODUCTION ]] || { echo '::error::migration confirmation mismatch'; exit 1; }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: true
          tags: ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.sha }}-migrations
      - name: Configure pinned SSH host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Apply and verify migrations on VPS
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MIGRATION_IMAGE: ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.sha }}-migrations
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/bi-migrate '$MIGRATION_IMAGE' '$GITHUB_ACTOR'"
