name: Apply BI Red migrations

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA on main (blank uses current main)
        required: false
        type: string
      confirmation:
        description: Type MIGRATE_RED
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: bi-red-release
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: red
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate migration SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'MIGRATE_RED' ]] || {
            echo '::error::Confirmation must equal MIGRATE_RED.'
            exit 1
          }
          git fetch origin main
          sha="${REQUESTED_SHA:-}"
          if [[ -z "$sha" ]]; then sha="$(git rev-parse origin/main)"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::A full 40-character SHA is required.'
            exit 1
          }
          git merge-base --is-ancestor "$sha" origin/main || {
            echo '::error::SHA is not on main.'
            exit 1
          }
          successful_ci=$(gh run list --workflow CI --commit "$sha" --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          [[ "$successful_ci" -gt 0 ]] || {
            echo '::error::SHA has no successful CI run.'
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Red migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: true
          tags: ${{ steps.release.outputs.repository }}:red-${{ steps.release.outputs.sha }}-migrations
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            com.hrpartner.environment=red
            com.hrpartner.kind=migrations
          cache-from: type=gha,scope=red-migrations
          cache-to: type=gha,mode=max,scope=red-migrations

      - name: Configure pinned Red SSH host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RED_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RED_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Apply migrations only to Supabase Red
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RED_HOST: ${{ secrets.RED_HOST }}
          RED_USER: ${{ secrets.RED_USER }}
          MIGRATION_IMAGE: ${{ steps.release.outputs.repository }}:red-${{ steps.release.outputs.sha }}-migrations
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RED_USER@$RED_HOST" \
            "sudo -n /usr/local/sbin/bi-red-migrate '$MIGRATION_IMAGE' '$GITHUB_ACTOR'"
