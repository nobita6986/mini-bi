name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
  SUPABASE_SECRET_KEY: ci-placeholder-not-a-secret
  SUPABASE_DB_URL: postgresql://ci:ci_db_password_placeholder_not_a_secret_2026@127.0.0.1:5432/ci
  SUPABASE_CONFIG_FILE: /dev/null
  DIRECT_ENTRY_API_ENABLED: "false"
  PIPELINE_CHECK_ENABLED: "false"
  AI_REPORTS_ENABLED: "false"

jobs:
  static:
    name: Static quality (typecheck · lint · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Validate migration files without connecting to a database
        run: pnpm db:migrate -- --offline
      - name: Build
        run: pnpm build
      - name: Check public bundle and repository for secrets
        run: pnpm secrets:check
      - name: Check documentation examples
        run: pnpm docs:check

  tests:
    name: PGlite tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Run test shard
        run: node scripts/run-ci-test-shard.mjs ${{ matrix.shard }}

  postgres:
    name: Real PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL for real concurrency regression
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb" && test -x "$pg_bin/pg_ctl"
          echo "P3_1_W02A_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Run real PostgreSQL concurrency regression
        run: node scripts/run-ci-test-shard.mjs postgres

  quality:
    name: Quality (typecheck · lint · tests · build)
    if: always()
    needs: [static, tests, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"
