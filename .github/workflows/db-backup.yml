name: Backup Supabase DB to R2

on:
  schedule:
    - cron: "15 */6 * * *"
      timezone: "Asia/Bangkok"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bi-production-db-backup
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: "2.121.0"

jobs:
  backup:
    name: Read-only backup to R2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Create and validate PostgreSQL backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          set -Eeuo pipefail

          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not configured."
            exit 1
          fi

          cli_version="$(supabase --version)"
          if [[ "$cli_version" != "$SUPABASE_CLI_VERSION" ]]; then
            echo "::error::Unexpected Supabase CLI version: expected ${SUPABASE_CLI_VERSION}, got ${cli_version}."
            exit 1
          fi

          timestamp="$(TZ=Asia/Bangkok date +'%Y-%m-%d_%H-%M-%S%z')"
          backup_timestamp="$(TZ=Asia/Bangkok date +'%Y-%m-%dT%H:%M:%S%:z')"
          date_dir="${timestamp:0:10}"
          object_prefix="production/6h/${date_dir}/${timestamp}"

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f roles.sql \
            --role-only

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f schema.sql

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f data.sql \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

          for file in roles.sql schema.sql data.sql; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Backup file ${file} is missing or empty."
              exit 1
            fi
          done

          if ! grep -Fq "direct_entry_catalog_bootstrap_executor" roles.sql; then
            echo "::error::roles.sql is missing required custom role direct_entry_catalog_bootstrap_executor."
            exit 1
          fi

          if ! grep -Eq '^(GRANT|REVOKE) ' schema.sql; then
            echo "::error::schema.sql does not contain ACL/GRANT statements."
            exit 1
          fi

          if ! grep -Eq '^COPY ("auth"\."users"|auth\.users)\b' data.sql && ! grep -Eq 'INTO ("auth"\."users"|auth\.users)\b' data.sql; then
            echo "::error::data.sql does not contain data or COPY statement for auth.users."
            exit 1
          fi

          sha256sum roles.sql schema.sql data.sql > SHA256SUMS
          sha256sum --check --status SHA256SUMS

          roles_size="$(stat -c %s roles.sql)"
          schema_size="$(stat -c %s schema.sql)"
          data_size="$(stat -c %s data.sql)"
          sums_size="$(stat -c %s SHA256SUMS)"

          roles_sha256="$(awk '$2 == "roles.sql" { print $1 }' SHA256SUMS)"
          schema_sha256="$(awk '$2 == "schema.sql" { print $1 }' SHA256SUMS)"
          data_sha256="$(awk '$2 == "data.sql" { print $1 }' SHA256SUMS)"
          sums_sha256="$(sha256sum SHA256SUMS | awk '{ print $1 }')"

          jq -n \
            --arg backup_timestamp "$backup_timestamp" \
            --arg timezone "Asia/Bangkok" \
            --arg supabase_cli_version "$SUPABASE_CLI_VERSION" \
            --arg object_prefix "$object_prefix" \
            --argjson roles_size "$roles_size" \
            --arg roles_sha256 "$roles_sha256" \
            --argjson schema_size "$schema_size" \
            --arg schema_sha256 "$schema_sha256" \
            --argjson data_size "$data_size" \
            --arg data_sha256 "$data_sha256" \
            --argjson sums_size "$sums_size" \
            --arg sums_sha256 "$sums_sha256" \
            '{
              backup_timestamp: $backup_timestamp,
              timezone: $timezone,
              supabase_cli_version: $supabase_cli_version,
              object_prefix: $object_prefix,
              restore_order: [
                "roles.sql",
                "schema.sql",
                "data.sql"
              ],
              files: [
                {
                  name: "roles.sql",
                  size_bytes: $roles_size,
                  sha256: $roles_sha256
                },
                {
                  name: "schema.sql",
                  size_bytes: $schema_size,
                  sha256: $schema_sha256
                },
                {
                  name: "data.sql",
                  size_bytes: $data_size,
                  sha256: $data_sha256
                },
                {
                  name: "SHA256SUMS",
                  size_bytes: $sums_size,
                  sha256: $sums_sha256
                }
              ]
            }' > manifest.json

          for file in roles.sql schema.sql data.sql SHA256SUMS manifest.json; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Generated file ${file} is missing or empty."
              exit 1
            fi
            if grep -Fq "$SUPABASE_DB_URL" "$file"; then
              echo "::error::File ${file} unexpectedly contains the database connection string."
              exit 1
            fi
          done

          if grep -Eiq '(postgres(ql)?://|password|api[_-]?key|secret|token)' manifest.json; then
            echo "::error::manifest.json contains forbidden credential patterns."
            exit 1
          fi

          echo "R2_OBJECT_PREFIX=$object_prefix" >> "$GITHUB_ENV"

      - name: Upload backup and verify object sizes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -Eeuo pipefail

          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME R2_OBJECT_PREFIX; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required configuration ${name} is not set."
              exit 1
            fi
          done

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          upload_and_verify() {
            local file="$1"
            local object_key="${R2_OBJECT_PREFIX}/${file}"
            local local_size
            local remote_size

            local_size="$(stat -c %s "$file")"

            aws s3 cp \
              "$file" \
              "s3://${R2_BUCKET_NAME}/${object_key}" \
              --endpoint-url "$endpoint" \
              --only-show-errors

            remote_size="$(aws s3api head-object \
              --bucket "$R2_BUCKET_NAME" \
              --key "$object_key" \
              --endpoint-url "$endpoint" \
              --query ContentLength \
              --output text)"

            if [[ "$local_size" != "$remote_size" ]]; then
              echo "::error::Uploaded object size mismatch for ${object_key} (local=${local_size}, remote=${remote_size})."
              exit 1
            fi

            echo "Uploaded and verified: ${object_key} (${local_size} bytes)"
          }

          for file in roles.sql schema.sql data.sql SHA256SUMS; do
            upload_and_verify "$file"
          done

          upload_and_verify "manifest.json"

          echo "Backup completed and verified: prefix=${R2_OBJECT_PREFIX}/ (5 objects)"
