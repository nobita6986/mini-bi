name: Backup Supabase DB to R2

on:
  schedule:
    - cron: "15 */6 * * *"
      timezone: "Asia/Bangkok"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bi-production-db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Read-only backup to R2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Create and validate PostgreSQL backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          set -Eeuo pipefail

          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not configured."
            exit 1
          fi

          timestamp="$(TZ=Asia/Bangkok date +'%Y-%m-%d_%H-%M-%S%z')"
          backup_file="bi-db-${timestamp}.dump"
          object_key="production/6h/${timestamp:0:10}/${backup_file}"

          docker run --rm \
            -e DATABASE_URL="$SUPABASE_DB_URL" \
            -e PGOPTIONS \
            -v "$PWD:/backup" \
            postgres:17 \
            sh -ceu '
              pg_dump "$DATABASE_URL" \
                --format=custom \
                --compress=6 \
                --no-owner \
                --no-privileges \
                --lock-wait-timeout=10s \
                --file="/backup/$1"
              pg_restore --list "/backup/$1" >/dev/null
            ' -- "$backup_file"

          test -s "$backup_file"
          echo "BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"
          echo "R2_OBJECT_KEY=$object_key" >> "$GITHUB_ENV"

      - name: Upload backup and verify object size
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -Eeuo pipefail

          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Repository secret $name is not configured."
              exit 1
            fi
          done

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          local_size="$(stat -c %s "$BACKUP_FILE")"

          aws s3 cp \
            "$BACKUP_FILE" \
            "s3://${R2_BUCKET_NAME}/${R2_OBJECT_KEY}" \
            --endpoint-url "$endpoint" \
            --only-show-errors

          remote_size="$(aws s3api head-object \
            --bucket "$R2_BUCKET_NAME" \
            --key "$R2_OBJECT_KEY" \
            --endpoint-url "$endpoint" \
            --query ContentLength \
            --output text)"

          if [[ "$local_size" != "$remote_size" ]]; then
            echo "::error::Uploaded object size does not match the local backup."
            exit 1
          fi

          echo "Backup uploaded and verified: s3://${R2_BUCKET_NAME}/${R2_OBJECT_KEY}"
