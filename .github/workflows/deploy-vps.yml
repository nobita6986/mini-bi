name: Deploy BI to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA on main (blank uses current main)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: bi-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate release SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          sha="${REQUESTED_SHA:-${WORKFLOW_SHA:-}}"
          if [[ -z "$sha" ]]; then sha="$(git rev-parse origin/main)"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::full 40-character SHA required'; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo '::error::SHA is not on main'; exit 1; }
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            successful_ci=$(gh run list --workflow CI --commit "$sha" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
            [[ "$successful_ci" -gt 0 ]] || { echo '::error::SHA has no successful CI run'; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Require production Supabase build settings
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_URL" && -n "$SUPABASE_KEY" ]] || {
            echo '::error::Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in the production environment variables.'
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: true
          tags: ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.sha }}-migrations
      - name: Configure pinned SSH host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Check database migrations, deploy, and wait for health
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.sha }}
          MIGRATION_IMAGE: ${{ steps.release.outputs.repository }}:${{ steps.release.outputs.sha }}-migrations
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/bi-release '$IMAGE' '$MIGRATION_IMAGE' '$GITHUB_ACTOR'"
